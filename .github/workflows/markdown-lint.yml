name: Check markdown in documentation changes

on:
  pull_request:
    paths:
      - 'docs/**'
jobs:
  check_markdown:
    name: Check markdown in changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
      - name: Install dependencies
        run: .github/workflows/markdown-lint-install
      - id: file_changes
        name: Track file changes
        run: |
          git -c core.quotepath=off diff --name-only --diff-filter=M HEAD^1 HEAD | jq -Rn '[inputs]' > "$HOME/files_modified.json"
          git -c core.quotepath=off diff --name-only --diff-filter=A HEAD^1 HEAD | jq -Rn '[inputs]' > "$HOME/files_added.json"
      - name: Check markdown on changed files
        run: .github/workflows/markdown-lint lint
